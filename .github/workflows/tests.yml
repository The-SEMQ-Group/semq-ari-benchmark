name: tests

# Runs the pytest suite. The existing validate-submissions check only runs the
# scorer over the submissions, so before this nothing ran the tests -- a report
# generator / scorer contract break, or a regression in the harness statistics
# or the attestation binding, could land green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # semq is the public SEMQ SDK, an ordinary dependency from PyPI since
      # 1.0.0, so this one job covers the probe, the packed layout and the
      # pipeline. It no longer needs a CodeArtifact role.
      - name: Install the package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -c "import semq; print('semq', semq.__version__)"

      # -rs prints the reason for every skip. The remaining skips name the
      # private-SDK features the public SDK lacks (notary, regions, calibrated
      # chunking); see docs/proposals/public-sdk-port.md.
      # `shell: bash` runs with -o pipefail; the default shell does not, and
      # `| tee` would otherwise hide a failing pytest.
      - name: Run tests
        shell: bash
        run: pytest -v -rs | tee pytest.log

      # semq is a dependency now, so a skip for want of it means the install
      # broke, not that the environment lacks access.
      - name: Refuse SDK-missing skips
        shell: bash
        run: |
          if grep -q "could not import 'semq'" pytest.log; then
            echo "::error::semq is a dependency but some tests skipped for want of it"
            exit 1
          fi

      - name: Validate the mock-agent pipeline
        run: python -m ari.run --out /tmp/ari-report.json --validate

      - name: Build the package
        run: python -m build
