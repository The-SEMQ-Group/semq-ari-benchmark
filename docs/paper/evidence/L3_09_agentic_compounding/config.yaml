experiment:
  id: L3_09_agentic_compounding
  seed: 42
models:
- id: bge_large_en_v15
  hf_id: BAAI/bge-large-en-v1.5
  dim: 1024
  arch_family: encoder
  language: en
  normalize_output: true
  preferred_batch_size: 128
  notes: Top MTEB English retrieval baseline.
datasets:
- id: beir_nfcorpus
  hf_id: BeIR/nfcorpus
  qrels_split: test
  n_corpus: 3633
  n_queries: 323
  domain: medical
  notes: "NFCorpus \u2014 small medical IR benchmark from BEIR. Graded qrels (0/1/2);\n\
    we count score \u2265 1 as relevant. Canonical citation: Boteva et al. 2016.\n"
probes:
- id: semq_qbin_n2
  type: qbin
  n_bins: 2
  calibration_percentile: 0.99
  bits_per_dim_approx: 2.0
  notes: "SEMQ qbin n_bins=2 \u2014 sign + 1 magnitude bit per dim. Lowest-budget\
    \ qbin point."
runtime:
  batch_size: 32
  cache_embeddings: true
  device_strategy: gpu
  corpus_size_limit: 3000
  n_seeds: 100
  n_runs: 30
  n_hops: 15
  top_k: 10
  sigmas:
  - 0.0
  - 0.0001
  - 0.001
  - 0.003
  primary_sigma: 0.001
  h1_divergence_floor: 0.1
  h2_recall_floor: 0.98
